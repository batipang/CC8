plugins { id 'com.android.application' }
def releaseManifest = new groovy.json.JsonSlurper().parse(rootProject.file('../release.json'))
def component = releaseManifest.assistant
assert releaseManifest.schema_version == 1
assert component.version_code instanceof Integer && component.version_code > 0
assert component.version ==~ /\d+\.\d+\.\d+/
assert releaseManifest.protocol.version instanceof Integer && releaseManifest.protocol.version > 0
android {
    namespace 'com.happyhome.cc8assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.happyhome.cc8assistant'
        minSdk 21
        targetSdk 28
        versionCode component.version_code
        versionName component.version
        buildConfigField 'int', 'CC8_PROTOCOL', releaseManifest.protocol.version.toString()
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        diagnostic {
            storeFile rootProject.file(System.getenv('CC8_SIGNING_KEYSTORE') ?: '../cc8-diagnostics/signing/cc8-diagnostics-debug.jks')
            storePassword 'android'
            keyAlias 'cc8-diagnostics'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.diagnostic
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint {
        abortOnError true
        checkReleaseBuilds true
        // Private, sideloaded legacy-device diagnostic; not a Google Play release.
        disable 'ExpiredTargetSdkVersion'
    }
}
