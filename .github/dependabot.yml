version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directories:
      - /cc8-assistant
      - /cc8-diagnostics
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
