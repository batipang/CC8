name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          # macOS matches the verified local JDK and uses AWS delivery;
          # Linux keeps its existing provider. Both remain Java 21.
          distribution: ${{ runner.os == 'macOS' && 'corretto' || 'temurin' }}
          java-version: '21'
      - name: Install lightweight test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline suites (private audio is opt-in and skipped)
        run: |
          python -m pip check
          python tools/test_all.py

  quality:
    name: Python, Java and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install checksum-pinned format and workflow tools
        run: |
          python tools/quality.py setup
          python tools/ci_tools.py setup actionlint
      - name: Read-only checks (same rules as pre-commit)
        run: |
          python tools/quality.py check
          "$(python tools/ci_tools.py path actionlint)" -shellcheck=
          git diff --exit-code

  android:
    name: Android (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [cc8-assistant, cc8-diagnostics]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Provision the exact pinned Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          distribution="$RUNNER_TEMP/gradle-8.11.1-bin.zip"
          curl --disable --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 180 --max-filesize 136920070 \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/207876967' \
            --output "$distribution"
          python3 - "$distribution" <<'PY'
          import hashlib
          import sys
          digest = hashlib.sha256()
          size = 0
          with open(sys.argv[1], 'rb') as artifact:
              for block in iter(lambda: artifact.read(1024 * 1024), b''):
                  digest.update(block)
                  size += len(block)
          if size != 136920070 or digest.hexdigest() != 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6':
              raise SystemExit('Pinned Gradle distribution size/checksum mismatch')
          PY
          unzip -q "$distribution" -d "$RUNNER_TEMP/cc8-gradle"
          printf '%s\n' "$RUNNER_TEMP/cc8-gradle/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Keep wrapper validation and Gradle integration; provisioning above
          # verifies the unchanged distribution pin without the failing CDN.
          cache-disabled: true
      - name: Prepare SDK and ignored build configuration
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          python3 scripts/configure-toolchain.py \
            --java-home "$JAVA_HOME" --android-sdk "$ANDROID_HOME" \
            --gradle "$(command -v gradle)"
      - name: Compile and lint with a disposable CI certificate
        env:
          CC8_CI_PROJECT: ${{ matrix.project }}
        run: python3 "$CC8_CI_PROJECT/tools/build.py"
      - name: Verify actual APK certificate continuity and tamper rejection
        env:
          CC8_CI_PROJECT: ${{ matrix.project }}
        run: python3 tools/test_apk_signing.py "$CC8_CI_PROJECT/app/build/outputs/apk/release/app-release.apk"
      - name: Check built package and version against the release manifest
        env:
          CC8_CI_PROJECT: ${{ matrix.project }}
        run: python3 tools/release.py check-apk "${CC8_CI_PROJECT#cc8-}" "$CC8_CI_PROJECT/app/build/outputs/apk/release/app-release.apk"
      - name: Keep lint reports (no APK or signing keys)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-${{ matrix.project }}
          path: ${{ matrix.project }}/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Redacted history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/ci_tools.py setup gitleaks
      - run: python3 tools/security.py secrets

  dependencies:
    name: Pinned Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-security.txt
      - run: python tools/security.py audit
      - name: Keep package audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dependency-audit
          path: artifacts/security/audit-*.json
          if-no-files-found: error
          retention-days: 7

  gate:
    name: Required checks
    if: always()
    needs: [tests, quality, android, secrets, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every suite to succeed, including matrix children
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['CHECK_RESULTS'])
          failed = [name for name, value in results.items() if value['result'] != 'success']
          if failed:
              raise SystemExit('Required suites failed/skipped/cancelled: ' + ', '.join(failed))
          print('All required checks passed')
          PY
