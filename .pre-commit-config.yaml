minimum_pre_commit_version: '4.7.0'
repos:
  - repo: local
    hooks:
      - id: cc8-python-quality
        name: CC8 Python lint and formatting
        entry: python tools/quality.py check --python-only
        language: python
        additional_dependencies: [ruff==0.17.3, mypy==2.4.1]
        pass_filenames: false
        always_run: true
      - id: cc8-java-format
        name: CC8 Java formatting
        entry: python tools/quality.py check --java-only
        language: python
        pass_filenames: false
        always_run: true
