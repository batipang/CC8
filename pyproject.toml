[tool.ruff]
required-version = "==0.17.3"
target-version = "py311"
line-length = 100
force-exclude = true
extend-exclude = [".toolchains", "artifacts", "device-access/private", "**/build", "**/signing"]

[tool.ruff.lint]
select = ["F", "E4", "E9", "E701", "E702", "E703"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false

[tool.mypy]
python_version = "3.11"
strict = true
files = [
    "cc8-assistant/host/protocol.py",
    "cc8-assistant/host/identity_mode.py",
    "cc8-assistant/host/identity_controller.py",
    "cc8-assistant/host/meeting_protocol.py",
    "cc8-assistant/host/preference_protocol.py",
    "cc8-assistant/host/route_output.py",
    "cc8-assistant/host/wake_utterance.py",
    "cc8-assistant/host/lifecycle_cleanup.py",
    "cc8-assistant/host/backend_signals.py",
    "cc8-assistant/host/transport.py",
    "cc8-assistant/host/transport_channel.py",
    "cc8-assistant/host/transport_pairing.py",
    "cc8-assistant/host/tls_stream.py",
    "cc8-assistant/host/workspace.py",
    "cc8-assistant/host/reminder_policy.py",
    "cc8-assistant/host/reminder_store.py",
    "cc8-assistant/host/config_schema.py",
    "cc8-assistant/host/configuration.py",
    "cc8-assistant/host/release_info.py",
    "cc8-assistant/host/playout_receipt.py",
    "cc8-assistant/host/request_text.py",
    "cc8-assistant/host/report_sources.py",
    "cc8-assistant/host/report_archive_protocol.py",
    "cc8-assistant/host/report_checkpoint_protocol.py",
    "cc8-assistant/host/report_source_metadata.py",
    "cc8-assistant/host/workflow_definition.py",
    "cc8-assistant/host/workflow_protocol.py",
]
mypy_path = "$MYPY_CONFIG_FILE_DIR/cc8-assistant/host"
cache_dir = ".toolchains/cc8/quality/mypy-cache"
